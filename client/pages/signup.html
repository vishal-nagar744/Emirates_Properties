<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — PrimeSpace | Dubai Property Projects</title>
  <meta name="description" content="Create your PrimeSpace member account to access exclusive Dubai property projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>

  <div class="auth-layout">

    <!-- Visual panel -->
    <div
      class="auth-visual"
      style="background-image:url('https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1200&q=85')"
      role="img"
      aria-label="Dubai luxury property exterior"
    >
      <div>
        <div class="smallcaps" style="color:#d9c89d">PrimeSpace · Dubai</div>
        <h1 class="serif" style="font-size:clamp(36px,4vw,52px);margin:12px 0;line-height:1.06">A calmer way to manage your property journey.</h1>
        <p style="line-height:1.8;color:#d4dfda;font-size:14px">A focused, premium member experience for Dubai property projects.</p>
      </div>
    </div>

    <!-- Form panel -->
    <div class="auth-panel">
      <div class="auth-box card">
        <a class="brand" href="../index.html" aria-label="Return to PrimeSpace home">
          <span class="logo">PS</span>
          <span>PrimeSpace</span>
        </a>

        <h2 style="font-size:29px;color:var(--g);margin:28px 0 6px">Create your account</h2>
        <p style="font-size:13px;color:var(--muted);margin-bottom:22px">Start your PrimeSpace member journey.</p>

        <form class="fields" id="signup-form" novalidate>
          <div class="field">
            <label for="signup-name">Full Name</label>
            <input
              id="signup-name"
              type="text"
              required
              placeholder="Enter your full name"
              autocomplete="name"
            >
          </div>
          <div class="field">
            <label for="signup-mobile">UAE Mobile Number</label>
            <input
              id="signup-mobile"
              type="tel"
              required
              placeholder="+971 50 000 0000"
              autocomplete="tel"
              inputmode="tel"
            >
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input
              id="signup-password"
              type="password"
              required
              placeholder="Create a password"
              autocomplete="new-password"
            >
          </div>
          <div class="field">
            <label for="signup-confirm">Confirm Password</label>
            <input
              id="signup-confirm"
              type="password"
              required
              placeholder="Confirm your password"
              autocomplete="new-password"
            >
          </div>
          <div class="field">
            <label for="signup-invite" style="display:flex;justify-content:space-between;align-items:center">
              Invitation Code
              <span style="font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0">Optional</span>
            </label>
            <input
              id="signup-invite"
              type="text"
              placeholder="Enter invitation code (optional)"
              autocomplete="off"
              spellcheck="false"
            >
          </div>
          <button class="btn primary btn-full" type="submit" id="signup-submit-btn">Create account</button>
        </form>

        <p style="text-align:center;margin-top:18px;font-size:12px;color:var(--muted)">
          Already registered? <a style="color:var(--g);font-weight:700" href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast" role="alert" aria-live="polite"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
