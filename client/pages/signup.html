<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Emirates Properties</title>
  <meta name="description" content="Create your Emirates Properties account.">
  <link rel="icon" href="../assets/logo-nobg.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="auth-fit auth-signup">

  <div class="auth-layout">
    <aside
      class="auth-visual"
      style="background-image:url('https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1400&q=85')"
      role="img"
      aria-label="Bright modern living space"
    >
      <div>
        <p class="smallcaps" style="color:#dcc99b">New account</p>
        <h1 class="serif auth-visual-title">AED 100 welcome bonus.</h1>
        <p class="auth-visual-text">Name, mobile, and password.</p>
      </div>
    </aside>

    <div class="auth-panel">
      <div class="auth-box card">
        <a class="brand" href="../index.html" aria-label="Emirates Properties home">
          <img class="brand-logo" src="../assets/logo-nobg.png" alt="Emirates Properties">
        </a>

        <h2 class="auth-title">Create account</h2>

        <form class="fields" id="signup-form" novalidate>
          <div class="field">
            <label for="signup-name">Full name</label>
            <input
              id="signup-name"
              type="text"
              required
              placeholder="Your full name"
              autocomplete="name"
            >
            <p class="field-error" id="signup-name-error" hidden></p>
          </div>

          <div class="field">
            <label for="signup-mobile">Mobile number</label>
            <input
              id="signup-mobile"
              type="tel"
              required
              placeholder="+91 / +971 …"
              autocomplete="tel"
              inputmode="tel"
            >
            <p class="field-error" id="signup-mobile-error" hidden></p>
          </div>

          <div class="field">
            <label for="signup-password">Password</label>
            <div class="password-wrap">
              <input
                id="signup-password"
                type="password"
                required
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
              >
              <button class="password-toggle" type="button" data-toggle-password="signup-password" aria-label="Show password">Show</button>
            </div>
            <p class="field-error" id="signup-password-error" hidden></p>
          </div>

          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <div class="password-wrap">
              <input
                id="signup-confirm"
                type="password"
                required
                placeholder="Re-enter password"
                autocomplete="new-password"
              >
              <button class="password-toggle" type="button" data-toggle-password="signup-confirm" aria-label="Show password">Show</button>
            </div>
            <p class="field-error" id="signup-confirm-error" hidden></p>
          </div>

          <div class="field" id="signup-invite-field">
            <label for="signup-invite">Invitation code</label>
            <input
              id="signup-invite"
              type="text"
              placeholder="Friend’s referral code"
              autocomplete="off"
              spellcheck="false"
            >
            <p class="field-hint" id="signup-invite-hint" hidden></p>
            <p class="field-error" id="signup-invite-error" hidden></p>
          </div>

          <button class="btn primary btn-full" type="submit" id="signup-submit-btn">Create account</button>
        </form>

        <p class="auth-foot">
          Already registered? <a class="auth-link" href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast" role="alert" aria-live="polite"></div>

  <script src="../assets/js/env.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
