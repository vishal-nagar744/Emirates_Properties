<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — Emirates Properties</title>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (!params.get('section')) {
        if (params.get('tab') === 'bind' || params.get('bind')) params.set('section', 'bind');
        else if (params.get('panel')) params.set('section', params.get('panel'));
        else params.set('section', 'records');
      }
      location.replace('profile.html?' + params.toString());
    })();
  </script>
</head>
<body></body>
</html>
