<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Emirates Properties</title>
  <meta name="description" content="Sign in to Emirates Properties.">
  <link rel="icon" href="../assets/logo-nobg.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="auth-fit">

  <div class="auth-layout">
    <aside
      class="auth-visual"
      style="background-image:url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1400&q=85')"
      role="img"
      aria-label="Modern interior architecture"
    >
      <div>
        <p class="smallcaps" style="color:#dcc99b">Member access</p>
        <h1 class="serif auth-visual-title">Welcome back.</h1>
        <p class="auth-visual-text">Your projects, commissions, and wallet.</p>
      </div>
    </aside>

    <div class="auth-panel">
      <div class="auth-box card">
        <a class="brand" href="../index.html" aria-label="Emirates Properties home">
          <img class="brand-logo" src="../assets/logo-nobg.png" alt="Emirates Properties">
        </a>

        <h2 class="auth-title">Log in</h2>

        <div class="auth-alert auth-alert-success" id="login-reset" hidden></div>

        <form class="fields" id="login-form" novalidate>
          <div class="field">
            <label for="login-mobile">Mobile number</label>
            <input
              id="login-mobile"
              type="tel"
              required
              placeholder="+91 / +971 …"
              autocomplete="tel"
              inputmode="tel"
            >
            <p class="field-error" id="login-mobile-error" hidden></p>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input
                id="login-password"
                type="password"
                required
                placeholder="Enter password"
                autocomplete="current-password"
              >
              <button class="password-toggle" type="button" data-toggle-password="login-password" aria-label="Show password">Show</button>
            </div>
            <p class="field-error" id="login-password-error" hidden></p>
          </div>

          <div class="auth-row">
            <label class="check-label">
              <input type="checkbox" id="login-remember">
              <span>Remember me</span>
            </label>
            <a class="auth-link" href="forgot.html">Forgot password?</a>
          </div>

          <button class="btn primary btn-full" type="submit" id="login-submit-btn">Log in</button>
        </form>

        <p class="auth-foot">
          New here? <a class="auth-link" href="signup.html">Create an account</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast" role="alert" aria-live="polite"></div>

  <script src="../assets/js/env.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
