<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — Emirates Properties</title>
  <meta name="description" content="Reset your Emirates Properties password.">
  <link rel="icon" href="../assets/logo-nobg.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body class="auth-fit">

  <div class="auth-layout">
    <aside
      class="auth-visual"
      style="background-image:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=85')"
      role="img"
      aria-label="Calm modern architecture"
    >
      <div>
        <p class="smallcaps" style="color:#dcc99b">Account help</p>
        <h1 class="serif auth-visual-title">Reset your password.</h1>
        <p class="auth-visual-text">Use the mobile number on your account.</p>
      </div>
    </aside>

    <div class="auth-panel">
      <div class="auth-box card">
        <a class="brand" href="../index.html" aria-label="Emirates Properties home">
          <img class="brand-logo" src="../assets/logo-nobg.png" alt="Emirates Properties">
        </a>

        <h2 class="auth-title">Reset password</h2>

        <div class="auth-alert auth-alert-success" id="forgot-success" hidden>
          Password updated. You can log in.
        </div>

        <form class="fields" id="forgot-form" novalidate>
          <div class="field">
            <label for="forgot-mobile">Mobile number</label>
            <input
              id="forgot-mobile"
              type="tel"
              required
              placeholder="+91 / +971 …"
              autocomplete="tel"
              inputmode="tel"
            >
            <p class="field-error" id="forgot-mobile-error" hidden></p>
          </div>

          <div class="field">
            <label for="forgot-password">New password</label>
            <input id="forgot-password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
            <p class="field-error" id="forgot-password-error" hidden></p>
          </div>

          <div class="field">
            <label for="forgot-confirm">Confirm password</label>
            <input id="forgot-confirm" type="password" autocomplete="new-password">
            <p class="field-error" id="forgot-confirm-error" hidden></p>
          </div>

          <button class="btn primary btn-full" type="submit" id="forgot-submit-btn">Update password</button>
        </form>

        <p class="auth-foot">
          Remembered it? <a class="auth-link" href="login.html">Back to login</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast" role="alert" aria-live="polite"></div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
