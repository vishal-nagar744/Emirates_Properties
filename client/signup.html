</style></head><body><div class="auth"><div class="visual" style="background-image:url('https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1200&q=85')"><div><div class="smallcaps" style="color:#d9c89d">PrimeSpace</div><h1 class="serif" style="font-size:52px;margin:12px 0">A calmer way to manage your property journey.</h1><p style="line-height:1.8;color:#d4dfda">A focused, premium member experience for property projects.</p></div></div><div class="panelauth"><div class="authbox card"><a class="brand" href="index.html"><span class="logo">PS</span><span>PrimeSpace</span></a><h2 style="font-size:31px;color:var(--g);margin:30px 0 7px">Create your account</h2><p style="font-size:13px;color:var(--muted);margin-bottom:24px">Start your PrimeSpace member journey.</p><form class="fields" data-demo="Demo form submitted — connect this screen to the backend."><div class="field"><label>Full name</label><input required placeholder="Enter full name"></div><div class="field"><label>Mobile number</label><input required placeholder="Enter mobile number"></div><div class="field"><label>Email address</label><input required type="email" placeholder="Enter email address"></div><div class="field"><label>Password</label><input required type="password" placeholder="Create password"></div><div class="field"><label>Confirm password</label><input required type="password" placeholder="Confirm password"></div><button class="btn primary">Create account</button></form><div style="text-align:center;margin-top:18px;font-size:12px;color:var(--muted)">Already registered? <a style="color:var(--g);font-weight:700" href="login.html">Log in</a></div></div></div></div><div class="toast"></div><script>function toast(x){let t=document.querySelector(".toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}function toggleSide(){document.querySelector(".sidebar")?.classList.toggle("open")}document.addEventListener("click",e=>{let h=e.target.clo
